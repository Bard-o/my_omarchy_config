source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 3
    brightness = 0.55
}

animations {
    enabled = false
}

image {
    monitor =
    path = ~/.face
    size = 200
    rounding = -1
    border_size = 5
    border_color = $inner_color
    position = 0, 120
    halign = center
    valign = center
    reload_time = 60
}

label {
    monitor =
    text = USERNAME
    font_family = Monocraft Nerd Font
    font_size = 25
    color = $font_color
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 487, 75
    position = 0, -100
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = Monocraft Nerd Font
    font_color = $font_color

    placeholder_text = Password here...
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

label {
    monitor =
    text = $TIME
    font_family = Monocraft Nerd Font
    font_size = 80
    color = $font_color
    position = -100, 100
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_family = Monocraft Nerd Font
    font_size = 22
    color = rgba(175, 165, 145, 1)
    position = -100, 75
    halign = right
    valign = bottom
}

auth {
    fingerprint:enabled = false
}
